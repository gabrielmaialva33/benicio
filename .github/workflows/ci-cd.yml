name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run the seeders after deploying (base access + demo data)'
        type: boolean
        default: false

# A second push while a deploy is mid-flight would race on the server checkout.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: db_testing
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm 11 is required: pnpm-workspace.yaml uses the `allowBuilds` format
      # (pnpm 11) to whitelist native build scripts (argon2, better-sqlite3).
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: |
          cp .env.test .env
          mkdir -p tmp

      # Browser suite (tests/browser/**) uses Playwright/Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Type check (backend + frontend)
        run: pnpm typecheck

      # Migrations run automatically in the Japa test setup; Postgres + Redis
      # come from the services above (.env.test points at localhost).
      - name: Backend tests (unit + functional + browser)
        run: pnpm test:e2e

      - name: Frontend tests (Vitest)
        run: pnpm test:ui

      - name: Build
        run: pnpm build

  # Builds the image on the server from the fresh checkout: no registry auth and
  # no image transfer, and the box has room to spare for it.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://benicio.juridicai.com.br

    steps:
      - name: Load the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          SEED_FLAG: ${{ inputs.seed && '--seed' || '' }}
        run: |
          ssh -o BatchMode=yes "$DEPLOY_TARGET" \
            "/opt/benicio/deploy/deploy.sh --ref ${{ github.sha }} $SEED_FLAG"

      - name: Smoke test
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 --retry-all-errors \
            https://benicio.juridicai.com.br/api/v1/health | head -c 400
