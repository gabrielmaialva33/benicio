openapi: 3.1.0
info:
  title: Benício API
  version: 1.0.0
  description: |
    ## Welcome to the Benício API

    The versioned API for the Benício legal operations platform, built with AdonisJS v7. It provides tenant-safe legal workflows, authentication, RBAC, file-backed documents, dashboard read models, realtime notifications, internal messages, and persisted AI conversations.

    ### Key Features

    - **JWT Authentication**: Secure token-based authentication with refresh tokens
    - **Role-Based Access Control**: Fine-grained permissions with multiple user roles
    - **User Management**: Complete CRUD operations for user accounts
    - **File Management**: Secure file upload with automatic categorization
    - **Legal Operations**: Clients, folders, cases, tasks, hearings, deadlines, movements, documents, and activity timelines
    - **Realtime**: Authenticated private channels over Server-Sent Events
    - **AI Chat**: Persisted conversations backed by an explicitly configured OpenAI-compatible provider
    - **Health Monitoring**: Built-in health check endpoints

    ## Authentication

    The API uses JWT Bearer authentication. To access protected endpoints:

    1. **Login**: POST to `/api/v1/sessions/sign-in` with your credentials
    2. **Get Token**: Extract the `access_token` from the response
    3. **Use Token**: Include `Authorization: Bearer <token>` in all requests

    ### Token Management

    - **Access Token Lifetime**: 15 minutes
    - **Refresh Token Lifetime**: 3 days
    - **Refresh Rotation**: Every refresh invalidates the previous token; replay revokes the token family
    - **Token Format**: JWT Bearer token

    ## API Conventions

    ### Request Format
    - **Content-Type**: `application/json` for all requests (except file uploads)
    - **Pagination**: Use `?page=1&per_page=10` query parameters
    - **Sorting**: Use `?sort_by=field&order=asc` or `?sort_by=field&order=desc`
    - **Searching**: Use `?search=term` for text search

    ### Response Format
    - **Success**: HTTP 2xx with JSON body
    - **Errors**: HTTP 4xx/5xx with standardized error format
    - **Timestamps**: ISO 8601 format
    - **Database Fields**: snake_case naming convention

    ### Common Headers
    ```
    Authorization: Bearer <token>
    x-tenant-id: <active tenant id>
    Content-Type: application/json
    Accept: application/json
    ```

  contact:
    name: Benício
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:3333
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john@example.com'
        username:
          type: [string, 'null']
          example: 'johndoe'
        email_verified:
          type: boolean
          description: Public verification state. Verification tokens are never serialized.
        email_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    ClientAddress:
      type: object
      additionalProperties: false
      properties:
        street:
          type: [string, 'null']
        number:
          type: [string, 'null']
        complement:
          type: [string, 'null']
        neighborhood:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        postal_code:
          type: [string, 'null']
        country:
          type: [string, 'null']

    Client:
      type: object
      required: [id, tenant_id, name, document, person_type, metadata, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
          example: 'Banco Exemplo S.A.'
        document:
          type: string
          description: Normalized CPF or CNPJ. CNPJ may be alphanumeric.
          example: 'AB12CD34EF5601'
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientInput:
      type: object
      additionalProperties: false
      required: [name, document, person_type]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        document:
          type: string
          maxLength: 32
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true

    ClientUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        document:
          type: string
          maxLength: 32
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true

    Folder:
      type: object
      required: [id, tenant_id, code, title, status, area, client_id, client, metadata]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        code:
          type: string
          example: 'PASTA-001'
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
        area:
          type: string
          example: 'Cível Contencioso'
        subarea:
          type: [string, 'null']
        client_id:
          type: integer
        responsible_lawyer_id:
          type: [integer, 'null']
        client:
          $ref: '#/components/schemas/Client'
        responsible_lawyer:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        metadata:
          type: object
          additionalProperties: true
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FolderInput:
      type: object
      additionalProperties: false
      required: [code, title, area, client_id]
      properties:
        code:
          type: string
          maxLength: 80
        title:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
          default: active
        area:
          type: string
          maxLength: 120
        subarea:
          type: [string, 'null']
          maxLength: 120
        client_id:
          type: integer
          minimum: 1
        responsible_lawyer_id:
          type: [integer, 'null']
          minimum: 1
        metadata:
          type: object
          additionalProperties: true

    FolderUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          maxLength: 80
        title:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
        area:
          type: string
          maxLength: 120
        subarea:
          type: [string, 'null']
          maxLength: 120
        client_id:
          type: integer
          minimum: 1
        responsible_lawyer_id:
          type: [integer, 'null']
          minimum: 1
        metadata:
          type: object
          additionalProperties: true

    ProcessPartyInput:
      type: object
      additionalProperties: false
      required: [side, name]
      properties:
        side:
          type: string
          enum: [active, passive, third, other]
        role:
          type: [string, 'null']
          maxLength: 80
          description: Specific procedural role, such as claimant or defendant.
        is_primary:
          type: boolean
          default: false
        name:
          type: string
          minLength: 2
          maxLength: 255
        document:
          type: [string, 'null']
          maxLength: 32
          description: Normalized CPF or alphanumeric CNPJ after validation.
        person_type:
          type: [string, 'null']
          enum: [individual, company, null]
        metadata:
          type: object
          additionalProperties: true

    ProcessParty:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, process_id, side, is_primary, name, metadata, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        process_id:
          type: integer
        side:
          type: string
          enum: [active, passive, third, other]
        role:
          type: [string, 'null']
        is_primary:
          type: boolean
        name:
          type: string
        document:
          type: [string, 'null']
        person_type:
          type: [string, 'null']
          enum: [individual, company, null]
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProcessMutation:
      type: object
      additionalProperties: false
      properties:
        cnj_number:
          type: [string, 'null']
          maxLength: 32
          description: CNJ number with or without punctuation; persisted as 20 digits and checked with Mod 97-10.
          example: '5144506-05.2026.8.09.0112'
        legacy_number:
          type: [string, 'null']
          maxLength: 80
          description: Original number for proceedings that predate CNJ numbering.
        internal_code:
          type: [string, 'null']
          maxLength: 80
        status:
          type: string
          enum: [active, suspended, archived, closed]
          default: active
        instance:
          type: [string, 'null']
          enum: [first, second, superior, null]
        phase:
          type: [string, 'null']
          enum: [knowledge, execution, appeal, sentence_compliance, null]
        distribution_type:
          type: [string, 'null']
          enum: [lottery, dependency, prevention, null]
        electronic:
          type: [boolean, 'null']
          description: Null means the source did not provide this fact.
        is_primary:
          type: boolean
          default: false
        nature:
          type: [string, 'null']
          maxLength: 120
        action_type:
          type: [string, 'null']
          maxLength: 160
        tribunal:
          type: [string, 'null']
          maxLength: 160
        judicial_body:
          type: [string, 'null']
          maxLength: 160
        district:
          type: [string, 'null']
          maxLength: 160
        forum:
          type: [string, 'null']
          maxLength: 160
        court_division:
          type: [string, 'null']
          maxLength: 160
        judge:
          type: [string, 'null']
          maxLength: 160
        case_value:
          oneOf:
            - type: string
              pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
            - type: number
              minimum: 0
            - type: 'null'
        conviction_value:
          oneOf:
            - type: string
              pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
            - type: number
              minimum: 0
            - type: 'null'
        costs:
          oneOf:
            - type: string
              pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
            - type: number
              minimum: 0
            - type: 'null'
        fees:
          oneOf:
            - type: string
              pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
            - type: number
              minimum: 0
            - type: 'null'
        distribution_date:
          type: [string, 'null']
          format: date
        citation_date:
          type: [string, 'null']
          format: date
        entry_date:
          type: [string, 'null']
          format: date
        observation:
          type: [string, 'null']
        object_detail:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        parties:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProcessPartyInput'

    ProcessInput:
      allOf:
        - $ref: '#/components/schemas/ProcessMutation'
        - anyOf:
            - required: [cnj_number]
              properties:
                cnj_number:
                  type: string
                  minLength: 1
            - required: [legacy_number]
              properties:
                legacy_number:
                  type: string
                  minLength: 1
            - required: [internal_code]
              properties:
                internal_code:
                  type: string
                  minLength: 1

    ProcessUpdateInput:
      allOf:
        - $ref: '#/components/schemas/ProcessMutation'
      minProperties: 1

    Process:
      type: object
      required:
        [id, tenant_id, folder_id, status, is_primary, metadata, parties, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        folder_id:
          type: integer
        cnj_number:
          type: [string, 'null']
          pattern: '^[0-9]{20}$'
        cnj_year:
          type: [integer, 'null']
        cnj_segment:
          type: [string, 'null']
        cnj_tribunal_code:
          type: [string, 'null']
        cnj_origin_code:
          type: [string, 'null']
        legacy_number:
          type: [string, 'null']
        internal_code:
          type: [string, 'null']
        status:
          type: string
          enum: [active, suspended, archived, closed]
        instance:
          type: [string, 'null']
          enum: [first, second, superior, null]
        phase:
          type: [string, 'null']
          enum: [knowledge, execution, appeal, sentence_compliance, null]
        distribution_type:
          type: [string, 'null']
          enum: [lottery, dependency, prevention, null]
        electronic:
          type: [boolean, 'null']
        is_primary:
          type: boolean
        nature:
          type: [string, 'null']
        action_type:
          type: [string, 'null']
        tribunal:
          type: [string, 'null']
        judicial_body:
          type: [string, 'null']
        district:
          type: [string, 'null']
        forum:
          type: [string, 'null']
        court_division:
          type: [string, 'null']
        judge:
          type: [string, 'null']
        case_value:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        conviction_value:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        costs:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        fees:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        distribution_date:
          type: [string, 'null']
          format: date
        citation_date:
          type: [string, 'null']
          format: date
        entry_date:
          type: [string, 'null']
          format: date
        observation:
          type: [string, 'null']
        object_detail:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        parties:
          type: array
          items:
            $ref: '#/components/schemas/ProcessParty'
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Client'

    FolderEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Folder'

    ProcessEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Process'

    ClientsPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Client'

    FoldersPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Folder'

    ProcessesPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Process'

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'User'
        description:
          type: string
          example: 'Regular user role'
        slug:
          type: string
          enum: [root, admin, user, guest]
          example: 'user'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        auth:
          type: object
          properties:
            access_token:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            refresh_token:
              type: string
              example: 'refresh_token_string'

    Error:
      type: object
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: 'Resource not found'
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                example: 'Validation error'
              field:
                type: string
                example: 'email'
              rule:
                type: string
                example: 'email'

    Pagination:
      type: object
      properties:
        meta:
          type: object
          properties:
            total:
              type: integer
              example: 100
            per_page:
              type: integer
              example: 10
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 10
            first_page:
              type: integer
              example: 1
            first_page_url:
              type: string
              example: '/?page=1'
            last_page_url:
              type: string
              example: '/?page=10'
            next_page_url:
              type: string
              example: '/?page=2'
        previous_page_url:
          type: [string, 'null']
          example: null

    FileUploadResponse:
      type: object
      required: [id, fileId, url, clientName, fileCategory, fileType, size, extname]
      properties:
        id:
          type: integer
          description: Canonical file record ID.
        fileId:
          type: integer
          description: Legacy-compatible alias of `id`.
        url:
          type: string
          description: Authenticated API route that authorizes the active tenant before redirecting to a short-lived signed URL.
          example: '/api/v1/files/42/download'
        clientName:
          type: string
          example: 'document.pdf'
        fileCategory:
          type: string
          enum: [image, document, video, audio, file]
          example: 'document'
        fileType:
          type: string
          example: 'application/pdf'
        size:
          type: integer
          example: 12345
        extname:
          type: string
          example: 'pdf'

    AuthTokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          pattern: '^rt_'

    TenantMembership:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        is_active: { type: boolean }
        role: { type: string, enum: [owner, admin, member] }

    Task:
      type: object
      required: [id, tenant_id, creator_id, title, status, priority, tags, metadata]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        folder_id: { type: [integer, 'null'] }
        process_id: { type: [integer, 'null'] }
        assignee_id: { type: [integer, 'null'] }
        creator_id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [pending, in_progress, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        due_date: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 10000 }
        status: { type: string, enum: [pending, in_progress, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        due_date: { type: [string, 'null'], format: date-time }
        folder_id: { type: [integer, 'null'], minimum: 1 }
        process_id: { type: [integer, 'null'], minimum: 1 }
        assignee_id: { type: [integer, 'null'], minimum: 1 }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
        metadata: { type: object, additionalProperties: true }

    HearingAttendeeInput:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: { type: integer, minimum: 1 }
        role: { type: [string, 'null'], maxLength: 80 }
        is_required: { type: boolean }

    Hearing:
      type: object
      required: [id, tenant_id, process_id, creator_id, title, type, status, starts_at]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        process_id: { type: integer }
        creator_id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        type:
          type: string
          enum: [audience, judgment, conciliation, instruction, other]
        status: { type: string, enum: [scheduled, completed, cancelled, postponed] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        location: { type: [string, 'null'] }
        online_url: { type: [string, 'null'], format: uri }
        judge: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        result: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        attendees: { type: array, items: { $ref: '#/components/schemas/User' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HearingInput:
      type: object
      additionalProperties: false
      required: [process_id, title, type, starts_at]
      properties:
        process_id: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 10000 }
        type:
          type: string
          enum: [audience, judgment, conciliation, instruction, other]
        status: { type: string, enum: [scheduled, completed, cancelled, postponed] }
