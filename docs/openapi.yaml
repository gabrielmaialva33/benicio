openapi: 3.1.0
info:
  title: Benício API
  version: 1.0.0
  description: |
    ## Welcome to the Benício API

    The versioned API for the Benício legal operations platform, built with AdonisJS v7. The current foundation provides user management, multi-tenancy, role-based access control, and file management capabilities.

    ### Key Features

    - **JWT Authentication**: Secure token-based authentication with refresh tokens
    - **Role-Based Access Control**: Fine-grained permissions with multiple user roles
    - **User Management**: Complete CRUD operations for user accounts
    - **File Management**: Secure file upload with automatic categorization
    - **Health Monitoring**: Built-in health check endpoints

    ## Authentication

    The API uses JWT Bearer authentication. To access protected endpoints:

    1. **Login**: POST to `/api/v1/sessions/sign-in` with your credentials
    2. **Get Token**: Extract the `access_token` from the response
    3. **Use Token**: Include `Authorization: Bearer <token>` in all requests

    ### Token Management

    - **Access Token Lifetime**: 1 hour
    - **Refresh Token Lifetime**: 3 days
    - **Token Format**: JWT Bearer token

    ## API Conventions

    ### Request Format
    - **Content-Type**: `application/json` for all requests (except file uploads)
    - **Pagination**: Use `?page=1&per_page=10` query parameters
    - **Sorting**: Use `?sort_by=field&order=asc` or `?sort_by=field&order=desc`
    - **Searching**: Use `?search=term` for text search

    ### Response Format
    - **Success**: HTTP 2xx with JSON body
    - **Errors**: HTTP 4xx/5xx with standardized error format
    - **Timestamps**: ISO 8601 format
    - **Database Fields**: snake_case naming convention

    ### Common Headers
    ```
    Authorization: Bearer <token>
    Content-Type: application/json
    Accept: application/json
    ```

  contact:
    name: Benício
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:3333
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john@example.com'
        username:
          type: string
          example: 'johndoe'
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    ClientAddress:
      type: object
      additionalProperties: false
      properties:
        street:
          type: [string, 'null']
        number:
          type: [string, 'null']
        complement:
          type: [string, 'null']
        neighborhood:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        postal_code:
          type: [string, 'null']
        country:
          type: [string, 'null']

    Client:
      type: object
      required: [id, tenant_id, name, document, person_type, metadata, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
          example: 'Banco Exemplo S.A.'
        document:
          type: string
          description: Normalized CPF or CNPJ. CNPJ may be alphanumeric.
          example: 'AB12CD34EF5601'
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientInput:
      type: object
      additionalProperties: false
      required: [name, document, person_type]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        document:
          type: string
          maxLength: 32
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true

    ClientUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        document:
          type: string
          maxLength: 32
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true

    Folder:
      type: object
      required: [id, tenant_id, code, title, status, area, client_id, client, metadata]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        code:
          type: string
          example: 'PASTA-001'
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
        area:
          type: string
          example: 'Cível Contencioso'
        subarea:
          type: [string, 'null']
        client_id:
          type: integer
        responsible_lawyer_id:
          type: [integer, 'null']
        client:
          $ref: '#/components/schemas/Client'
        responsible_lawyer:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        metadata:
          type: object
          additionalProperties: true
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FolderInput:
      type: object
      additionalProperties: false
      required: [code, title, area, client_id]
      properties:
        code:
          type: string
          maxLength: 80
        title:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
          default: active
        area:
          type: string
          maxLength: 120
        subarea:
          type: [string, 'null']
          maxLength: 120
        client_id:
          type: integer
          minimum: 1
        responsible_lawyer_id:
          type: [integer, 'null']
          minimum: 1
        metadata:
          type: object
          additionalProperties: true

    FolderUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          maxLength: 80
        title:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
        area:
          type: string
          maxLength: 120
        subarea:
          type: [string, 'null']
          maxLength: 120
        client_id:
          type: integer
          minimum: 1
        responsible_lawyer_id:
          type: [integer, 'null']
          minimum: 1
        metadata:
          type: object
          additionalProperties: true

    ClientEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Client'

    FolderEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Folder'

    ClientsPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Client'

    FoldersPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Folder'

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'User'
        description:
          type: string
          example: 'Regular user role'
        slug:
          type: string
          enum: [root, admin, user, guest]
          example: 'user'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        auth:
          type: object
          properties:
            access_token:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            refresh_token:
              type: string
              example: 'refresh_token_string'

    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                example: 'Validation error'
              field:
                type: string
                example: 'email'
              rule:
                type: string
                example: 'email'

    Pagination:
      type: object
      properties:
        meta:
          type: object
          properties:
            total:
              type: integer
              example: 100
            per_page:
              type: integer
              example: 10
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 10
            first_page:
              type: integer
              example: 1
            first_page_url:
              type: string
              example: '/?page=1'
            last_page_url:
              type: string
              example: '/?page=10'
            next_page_url:
              type: string
              example: '/?page=2'
            previous_page_url:
              type: string
              example: null

    FileUploadResponse:
      type: object
      properties:
        url:
          type: string
          example: 'https://storage.example.com/files/abc123.pdf'
        clientName:
          type: string
          example: 'document.pdf'
        fileCategory:
          type: string
          enum: [image, document, video, audio, file]
          example: 'document'
        fileType:
          type: string
          example: 'application/pdf'
        size:
          type: integer
          example: 12345
        extname:
          type: string
          example: 'pdf'

  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID

    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination

    perPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of items per page

    sortByParam:
      name: sort_by
      in: query
      schema:
        type: string
        default: id
      description: Field to sort by

    orderParam:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort order

    searchParam:
      name: search
      in: query
      schema:
        type: string
      description: Search term for filtering results

    tenantIdHeader:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
      description: Active tenant. Falls back to the signed JWT claim or the user's first active tenant.

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Unauthorized'

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Forbidden'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Resource not found'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: Health
    description: System health monitoring endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Roles
    description: Role management operations (admin only)
  - name: Files
    description: File upload and management
  - name: Profile
    description: Current user profile operations
  - name: Permissions
    description: Permission management operations (admin only)
  - name: Clients
    description: Tenant-scoped legal client management
  - name: Folders
    description: Tenant-scoped legal matter and folder management

paths:
  /version:
    get:
      operationId: getApiInfo
      summary: Get API information
      description: Returns basic information about the API
      tags:
        - Health
      security: []
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: 'benicio'
                  description:
                    type: string
                    example: 'Plataforma jurídica multi-tenant construída com AdonisJS, Inertia e React.'
                  version:
                    type: string
                    example: '0.0.0'
                  author:
                    type: string
                    example: 'Gabriel Maia'
                  contributors:
                    type: array
                    items:
                      type: string
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Check the health status of the API and its services
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                    example: true
                  services:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          healthy:
                            type: boolean
                            example: true
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                    example: false
                  services:
                    type: object

  /api/v1/sessions/sign-in:
    post:
      operationId: signIn
      summary: User login
      description: Authenticate a user and receive JWT tokens
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uid
                - password
              properties:
                uid:
                  type: string
                  description: Email or username
                  example: 'john@example.com'
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: 'password123'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errors:
                  - message: 'Invalid credentials'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/me:
    get:
      operationId: getProfile
      summary: Get current user profile
      description: Retrieve the profile of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/me/permissions:
    get:
      operationId: getMyPermissions
      summary: Get current user permissions
      description: Retrieve the permissions of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Permissions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                      example: 'users.create'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/me/roles:
    get:
      operationId: getMyRoles
      summary: Get current user roles
      description: Retrieve the roles of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/sessions/sign-up:
    post:
      operationId: signUp
      summary: User registration
      description: Create a new user account
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - password_confirmation
              properties:
                full_name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  format: email
                  example: 'john@example.com'
                username:
                  type: string
                  example: 'johndoe'
                  description: Optional username
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: 'password123'
                password_confirmation:
                  type: string
                  format: password
                  example: 'password123'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/verify-email:
    get:
      operationId: verifyEmail
      summary: Verify user email
      description: Verify a user's email address using a token from the verification link.
      tags:
        - Authentication
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: The email verification token
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token

  /api/v1/resend-verification-email:
    post:
      operationId: resendVerificationEmail
      summary: Resend verification email
      description: Resends the email verification link to the authenticated user.
      tags:
        - Authentication
      responses:
        '200':
          description: Verification email sent successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users
      description: Get a paginated list of users with optional search and sorting
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/orderParam'
        - $ref: '#/components/parameters/searchParam'
      responses:
        '200':
          description: User list retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      operationId: createUser
      summary: Create user
      description: Create a new user account (requires USER role)
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - password_confirmation
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                username:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 6
                password_confirmation:
                  type: string
                  format: password
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/{id}:
    get:
      operationId: getUserById
      summary: Get user by ID
      description: Retrieve a specific user's details
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      operationId: updateUser
      summary: Update user
      description: Update user details (email and username cannot be changed)
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 6
                password_confirmation:
                  type: string
                  format: password
                  description: Required if password is provided
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      operationId: deleteUser
      summary: Delete user
      description: Soft delete a user (marks as deleted)
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/roles:
    get:
      operationId: listRoles
      summary: List roles
      description: Get a paginated list of roles (requires ADMIN or ROOT role)
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Role list retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/admin/roles/attach:
    put:
      operationId: attachRoles
      summary: Attach roles to user
      description: Assign roles to a user (requires ADMIN or ROOT role)
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - role_ids
              properties:
                user_id:
                  type: integer
                  example: 1
                role_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: Roles attached successfully
          content:
            application/json:
              schema:
