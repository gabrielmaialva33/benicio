openapi: 3.1.0
info:
  title: Benício API
  version: 1.0.0
  description: |
    ## Welcome to the Benício API

    The versioned API for the Benício legal operations platform, built with AdonisJS v7. It provides tenant-safe legal workflows, authentication, RBAC, file-backed documents, dashboard read models, realtime notifications, internal messages, and persisted AI conversations.

    ### Key Features

    - **JWT Authentication**: Secure token-based authentication with refresh tokens
    - **Role-Based Access Control**: Fine-grained permissions with multiple user roles
    - **User Management**: Complete CRUD operations for user accounts
    - **File Management**: Secure file upload with automatic categorization
    - **Legal Operations**: Clients, folders, cases, tasks, hearings, deadlines, movements, documents, and activity timelines
    - **Realtime**: Authenticated private channels over Server-Sent Events
    - **AI Chat**: Persisted conversations backed by an explicitly configured OpenAI-compatible provider
    - **Health Monitoring**: Built-in health check endpoints

    ## Authentication

    The API uses JWT Bearer authentication. To access protected endpoints:

    1. **Login**: POST to `/api/v1/sessions/sign-in` with your credentials
    2. **Get Token**: Extract the `access_token` from the response
    3. **Use Token**: Include `Authorization: Bearer <token>` in all requests

    ### Token Management

    - **Access Token Lifetime**: 15 minutes
    - **Refresh Token Lifetime**: 3 days
    - **Refresh Rotation**: Every refresh invalidates the previous token; replay revokes the token family
    - **Token Format**: JWT Bearer token

    ## API Conventions

    ### Request Format
    - **Content-Type**: `application/json` for all requests (except file uploads)
    - **Pagination**: Use `?page=1&per_page=10` query parameters
    - **Sorting**: Use `?sort_by=field&order=asc` or `?sort_by=field&order=desc`
    - **Searching**: Use `?search=term` for text search

    ### Response Format
    - **Success**: HTTP 2xx with JSON body
    - **Errors**: HTTP 4xx/5xx with standardized error format
    - **Timestamps**: ISO 8601 format
    - **Database Fields**: snake_case naming convention

    ### Common Headers
    ```
    Authorization: Bearer <token>
    x-tenant-id: <active tenant id>
    Content-Type: application/json
    Accept: application/json
    ```

  contact:
    name: Benício
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:3333
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'john@example.com'
        username:
          type: string
          example: 'johndoe'
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    ClientAddress:
      type: object
      additionalProperties: false
      properties:
        street:
          type: [string, 'null']
        number:
          type: [string, 'null']
        complement:
          type: [string, 'null']
        neighborhood:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        postal_code:
          type: [string, 'null']
        country:
          type: [string, 'null']

    Client:
      type: object
      required: [id, tenant_id, name, document, person_type, metadata, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
          example: 'Banco Exemplo S.A.'
        document:
          type: string
          description: Normalized CPF or CNPJ. CNPJ may be alphanumeric.
          example: 'AB12CD34EF5601'
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientInput:
      type: object
      additionalProperties: false
      required: [name, document, person_type]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        document:
          type: string
          maxLength: 32
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true

    ClientUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        document:
          type: string
          maxLength: 32
        person_type:
          type: string
          enum: [individual, company]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        address:
          oneOf:
            - $ref: '#/components/schemas/ClientAddress'
            - type: 'null'
        notes:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true

    Folder:
      type: object
      required: [id, tenant_id, code, title, status, area, client_id, client, metadata]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        code:
          type: string
          example: 'PASTA-001'
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
        area:
          type: string
          example: 'Cível Contencioso'
        subarea:
          type: [string, 'null']
        client_id:
          type: integer
        responsible_lawyer_id:
          type: [integer, 'null']
        client:
          $ref: '#/components/schemas/Client'
        responsible_lawyer:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        metadata:
          type: object
          additionalProperties: true
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FolderInput:
      type: object
      additionalProperties: false
      required: [code, title, area, client_id]
      properties:
        code:
          type: string
          maxLength: 80
        title:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
          default: active
        area:
          type: string
          maxLength: 120
        subarea:
          type: [string, 'null']
          maxLength: 120
        client_id:
          type: integer
          minimum: 1
        responsible_lawyer_id:
          type: [integer, 'null']
          minimum: 1
        metadata:
          type: object
          additionalProperties: true

    FolderUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          maxLength: 80
        title:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed, pending, cancelled, archived]
        area:
          type: string
          maxLength: 120
        subarea:
          type: [string, 'null']
          maxLength: 120
        client_id:
          type: integer
          minimum: 1
        responsible_lawyer_id:
          type: [integer, 'null']
          minimum: 1
        metadata:
          type: object
          additionalProperties: true

    ProcessPartyInput:
      type: object
      additionalProperties: false
      required: [side, name]
      properties:
        side:
          type: string
          enum: [active, passive, third, other]
        role:
          type: [string, 'null']
          maxLength: 80
          description: Specific procedural role, such as claimant or defendant.
        is_primary:
          type: boolean
          default: false
        name:
          type: string
          minLength: 2
          maxLength: 255
        document:
          type: [string, 'null']
          maxLength: 32
          description: Normalized CPF or alphanumeric CNPJ after validation.
        person_type:
          type: [string, 'null']
          enum: [individual, company, null]
        metadata:
          type: object
          additionalProperties: true

    ProcessParty:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, process_id, side, is_primary, name, metadata, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        process_id:
          type: integer
        side:
          type: string
          enum: [active, passive, third, other]
        role:
          type: [string, 'null']
        is_primary:
          type: boolean
        name:
          type: string
        document:
          type: [string, 'null']
        person_type:
          type: [string, 'null']
          enum: [individual, company, null]
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProcessMutation:
      type: object
      additionalProperties: false
      properties:
        cnj_number:
          type: [string, 'null']
          maxLength: 32
          description: CNJ number with or without punctuation; persisted as 20 digits and checked with Mod 97-10.
          example: '5144506-05.2026.8.09.0112'
        legacy_number:
          type: [string, 'null']
          maxLength: 80
          description: Original number for proceedings that predate CNJ numbering.
        internal_code:
          type: [string, 'null']
          maxLength: 80
        status:
          type: string
          enum: [active, suspended, archived, closed]
          default: active
        instance:
          type: [string, 'null']
          enum: [first, second, superior, null]
        phase:
          type: [string, 'null']
          enum: [knowledge, execution, appeal, sentence_compliance, null]
        distribution_type:
          type: [string, 'null']
          enum: [lottery, dependency, prevention, null]
        electronic:
          type: [boolean, 'null']
          description: Null means the source did not provide this fact.
        is_primary:
          type: boolean
          default: false
        nature:
          type: [string, 'null']
          maxLength: 120
        action_type:
          type: [string, 'null']
          maxLength: 160
        tribunal:
          type: [string, 'null']
          maxLength: 160
        judicial_body:
          type: [string, 'null']
          maxLength: 160
        district:
          type: [string, 'null']
          maxLength: 160
        forum:
          type: [string, 'null']
          maxLength: 160
        court_division:
          type: [string, 'null']
          maxLength: 160
        judge:
          type: [string, 'null']
          maxLength: 160
        case_value:
          oneOf:
            - type: string
              pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
            - type: number
              minimum: 0
            - type: 'null'
        conviction_value:
          oneOf:
            - type: string
              pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
            - type: number
              minimum: 0
            - type: 'null'
        costs:
          oneOf:
            - type: string
              pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
            - type: number
              minimum: 0
            - type: 'null'
        fees:
          oneOf:
            - type: string
              pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
            - type: number
              minimum: 0
            - type: 'null'
        distribution_date:
          type: [string, 'null']
          format: date
        citation_date:
          type: [string, 'null']
          format: date
        entry_date:
          type: [string, 'null']
          format: date
        observation:
          type: [string, 'null']
        object_detail:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        parties:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProcessPartyInput'

    ProcessInput:
      allOf:
        - $ref: '#/components/schemas/ProcessMutation'
        - anyOf:
            - required: [cnj_number]
              properties:
                cnj_number:
                  type: string
                  minLength: 1
            - required: [legacy_number]
              properties:
                legacy_number:
                  type: string
                  minLength: 1
            - required: [internal_code]
              properties:
                internal_code:
                  type: string
                  minLength: 1

    ProcessUpdateInput:
      allOf:
        - $ref: '#/components/schemas/ProcessMutation'
      minProperties: 1

    Process:
      type: object
      required:
        [id, tenant_id, folder_id, status, is_primary, metadata, parties, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        folder_id:
          type: integer
        cnj_number:
          type: [string, 'null']
          pattern: '^[0-9]{20}$'
        cnj_year:
          type: [integer, 'null']
        cnj_segment:
          type: [string, 'null']
        cnj_tribunal_code:
          type: [string, 'null']
        cnj_origin_code:
          type: [string, 'null']
        legacy_number:
          type: [string, 'null']
        internal_code:
          type: [string, 'null']
        status:
          type: string
          enum: [active, suspended, archived, closed]
        instance:
          type: [string, 'null']
          enum: [first, second, superior, null]
        phase:
          type: [string, 'null']
          enum: [knowledge, execution, appeal, sentence_compliance, null]
        distribution_type:
          type: [string, 'null']
          enum: [lottery, dependency, prevention, null]
        electronic:
          type: [boolean, 'null']
        is_primary:
          type: boolean
        nature:
          type: [string, 'null']
        action_type:
          type: [string, 'null']
        tribunal:
          type: [string, 'null']
        judicial_body:
          type: [string, 'null']
        district:
          type: [string, 'null']
        forum:
          type: [string, 'null']
        court_division:
          type: [string, 'null']
        judge:
          type: [string, 'null']
        case_value:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        conviction_value:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        costs:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        fees:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
        distribution_date:
          type: [string, 'null']
          format: date
        citation_date:
          type: [string, 'null']
          format: date
        entry_date:
          type: [string, 'null']
          format: date
        observation:
          type: [string, 'null']
        object_detail:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        parties:
          type: array
          items:
            $ref: '#/components/schemas/ProcessParty'
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Client'

    FolderEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Folder'

    ProcessEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Process'

    ClientsPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Client'

    FoldersPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Folder'

    ProcessesPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Process'

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'User'
        description:
          type: string
          example: 'Regular user role'
        slug:
          type: string
          enum: [root, admin, user, guest]
          example: 'user'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        auth:
          type: object
          properties:
            access_token:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            refresh_token:
              type: string
              example: 'refresh_token_string'

    Error:
      type: object
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: 'Resource not found'
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                example: 'Validation error'
              field:
                type: string
                example: 'email'
              rule:
                type: string
                example: 'email'

    Pagination:
      type: object
      properties:
        meta:
          type: object
          properties:
            total:
              type: integer
              example: 100
            per_page:
              type: integer
              example: 10
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 10
            first_page:
              type: integer
              example: 1
            first_page_url:
              type: string
              example: '/?page=1'
            last_page_url:
              type: string
              example: '/?page=10'
            next_page_url:
              type: string
              example: '/?page=2'
            previous_page_url:
              type: string
              example: null

    FileUploadResponse:
      type: object
      required: [id, fileId, url, clientName, fileCategory, fileType, size, extname]
      properties:
        id:
          type: integer
          description: Canonical file record ID.
        fileId:
          type: integer
          description: Legacy-compatible alias of `id`.
        url:
          type: string
          example: 'https://storage.example.com/files/abc123.pdf'
        clientName:
          type: string
          example: 'document.pdf'
        fileCategory:
          type: string
          enum: [image, document, video, audio, file]
          example: 'document'
        fileType:
          type: string
          example: 'application/pdf'
        size:
          type: integer
          example: 12345
        extname:
          type: string
          example: 'pdf'

    AuthTokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          pattern: '^rt_'

    TenantMembership:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        is_active: { type: boolean }
        role: { type: string, enum: [owner, admin, member] }

    Task:
      type: object
      required: [id, tenant_id, creator_id, title, status, priority, tags, metadata]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        folder_id: { type: [integer, 'null'] }
        process_id: { type: [integer, 'null'] }
        assignee_id: { type: [integer, 'null'] }
        creator_id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [pending, in_progress, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        due_date: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 10000 }
        status: { type: string, enum: [pending, in_progress, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        due_date: { type: [string, 'null'], format: date-time }
        folder_id: { type: [integer, 'null'], minimum: 1 }
        process_id: { type: [integer, 'null'], minimum: 1 }
        assignee_id: { type: [integer, 'null'], minimum: 1 }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
        metadata: { type: object, additionalProperties: true }

    HearingAttendeeInput:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: { type: integer, minimum: 1 }
        role: { type: [string, 'null'], maxLength: 80 }
        is_required: { type: boolean }

    Hearing:
      type: object
      required: [id, tenant_id, process_id, creator_id, title, type, status, starts_at]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        process_id: { type: integer }
        creator_id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        type:
          type: string
          enum: [audience, judgment, conciliation, instruction, other]
        status: { type: string, enum: [scheduled, completed, cancelled, postponed] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        location: { type: [string, 'null'] }
        online_url: { type: [string, 'null'], format: uri }
        judge: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        result: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        attendees: { type: array, items: { $ref: '#/components/schemas/User' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HearingInput:
      type: object
      additionalProperties: false
      required: [process_id, title, type, starts_at]
      properties:
        process_id: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 10000 }
        type:
          type: string
          enum: [audience, judgment, conciliation, instruction, other]
        status: { type: string, enum: [scheduled, completed, cancelled, postponed] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        location: { type: [string, 'null'], maxLength: 500 }
        online_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        judge: { type: [string, 'null'], maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 20000 }
        result: { type: [string, 'null'], maxLength: 20000 }
        attendees:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HearingAttendeeInput' }
        metadata: { type: object, additionalProperties: true }

    Deadline:
      type: object
      required: [id, tenant_id, folder_id, creator_id, title, kind, status, priority, is_fatal, due_at]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        folder_id: { type: integer }
        process_id: { type: [integer, 'null'] }
        assignee_id: { type: [integer, 'null'] }
        creator_id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        kind: { type: string, enum: [judicial, extrajudicial, administrative, internal] }
        status: { type: string, enum: [pending, in_progress, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        is_fatal: { type: boolean }
        due_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        legal_basis: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeadlineInput:
      type: object
      additionalProperties: false
      required: [title, kind, due_at]
      properties:
        folder_id: { type: [integer, 'null'], minimum: 1 }
        process_id: { type: [integer, 'null'], minimum: 1 }
        assignee_id: { type: [integer, 'null'], minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 10000 }
        kind: { type: string, enum: [judicial, extrajudicial, administrative, internal] }
        status: { type: string, enum: [pending, in_progress, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        is_fatal: { type: boolean }
        due_at: { type: string, format: date-time }
        legal_basis: { type: [string, 'null'], maxLength: 20000 }
        notes: { type: [string, 'null'], maxLength: 20000 }
        metadata: { type: object, additionalProperties: true }

    Movement:
      type: object
      required: [id, tenant_id, process_id, occurred_at, kind, title, source, metadata]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        process_id: { type: integer }
        created_by: { type: [integer, 'null'] }
        occurred_at: { type: string, format: date-time }
        kind: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        source: { type: string, enum: [manual, court, integration, import] }
        external_id: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MovementInput:
      type: object
      additionalProperties: false
      required: [occurred_at, kind, title]
      properties:
        occurred_at: { type: string, format: date-time }
        kind: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 20000 }
        source: { type: string, enum: [manual, court, integration, import] }
        external_id: { type: [string, 'null'], maxLength: 255 }
        metadata: { type: object, additionalProperties: true }

    Activity:
      type: object
      required: [id, tenant_id, folder_id, event_type, summary, data, occurred_at, created_at]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        folder_id: { type: integer }
        process_id: { type: [integer, 'null'] }
        actor_id: { type: [integer, 'null'] }
        event_type: { type: string }
        summary: { type: string }
        data: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    LegalDocument:
      type: object
      required: [id, tenant_id, folder_id, file_id, created_by, document_type, title, version, is_signed]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        folder_id: { type: integer }
        process_id: { type: [integer, 'null'] }
        file_id: { type: integer }
        created_by: { type: integer }
        document_type: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        version: { type: integer }
        is_signed: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        file: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LegalDocumentInput:
      type: object
      additionalProperties: false
      required: [folder_id, file_id, document_type, title]
      properties:
        folder_id: { type: integer, minimum: 1 }
        process_id: { type: [integer, 'null'], minimum: 1 }
        file_id: { type: integer, minimum: 1 }
        document_type: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 20000 }
        version: { type: integer, minimum: 1, maximum: 10000 }
        is_signed: { type: boolean }
        metadata: { type: object, additionalProperties: true }

    Notification:
      type: object
      required: [id, tenant_id, recipient_id, type, title, message, data]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        recipient_id: { type: integer }
        actor_id: { type: [integer, 'null'] }
        type:
          type: string
          enum: [info, success, warning, error, task, hearing, deadline, message, system]
        title: { type: string }
        message: { type: string }
        read_at: { type: [string, 'null'], format: date-time }
        data: { type: object, additionalProperties: true }
        action_url: { type: [string, 'null'], format: uri }
        action_text: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationInput:
      type: object
      additionalProperties: false
      required: [recipient_id, title, message]
      properties:
        recipient_id: { type: integer, minimum: 1 }
        type:
          type: string
          enum: [info, success, warning, error, task, hearing, deadline, message, system]
        title: { type: string, minLength: 1, maxLength: 255 }
        message: { type: string, minLength: 1, maxLength: 20000 }
        data: { type: object, additionalProperties: true }
        action_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        action_text: { type: [string, 'null'], maxLength: 100 }

    InternalMessage:
      type: object
      required: [id, tenant_id, recipient_id, subject, body, priority, metadata]
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        recipient_id: { type: integer }
        sender_id: { type: [integer, 'null'] }
        subject: { type: string }
        body: { type: string }
        priority: { type: string, enum: [low, normal, high] }
        read_at: { type: [string, 'null'], format: date-time }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InternalMessageInput:
      type: object
      additionalProperties: false
      required: [recipient_id, subject, body]
      properties:
        recipient_id: { type: integer, minimum: 1 }
        subject: { type: string, minLength: 1, maxLength: 255 }
        body: { type: string, minLength: 1, maxLength: 50000 }
        priority: { type: string, enum: [low, normal, high] }
        metadata: { type: object, additionalProperties: true }

    AiMessage:
      type: object
      required: [id, conversation_id, role, content, created_at]
      properties:
        id: { type: integer }
        conversation_id: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    AiConversation:
      type: object
      required: [id, title, user_id, created_at, updated_at]
      properties:
        id: { type: integer }
        title: { type: string }
        user_id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AiMessage' }
        lastMessage:
          $ref: '#/components/schemas/AiMessage'

    AiChatInput:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 50000 }
        conversation_id: { type: integer, minimum: 1 }
        mode: { type: string, enum: [single, multi] }

    AiChatResponse:
      type: object
      required: [message, conversation]
      properties:
        message: { $ref: '#/components/schemas/AiMessage' }
        conversation: { $ref: '#/components/schemas/AiConversation' }

    DashboardSummary:
      type: object
      description: Tenant-scoped aggregates for folders, tasks, hearings, deadlines, and clients.
      required: [folders, tasks, hearings, deadlines, clients]
      properties:
        folders: { type: object, additionalProperties: true }
        tasks: { type: object, additionalProperties: true }
        hearings: { type: object, additionalProperties: true }
        deadlines: { type: object, additionalProperties: true }
        clients: { type: object, additionalProperties: true }

  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID

    folderId:
      name: folderId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      description: Folder ID in the active tenant.

    processId:
      name: processId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      description: Process ID in the active tenant.

    limitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }

    cursorParam:
      name: cursor
      in: query
      schema: { type: string, maxLength: 500 }
      description: Opaque keyset cursor returned by the previous activity page.

    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination

    perPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of items per page

    sortByParam:
      name: sort_by
      in: query
      schema:
        type: string
        default: id
      description: Field to sort by

    orderParam:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort order

    searchParam:
      name: search
      in: query
      schema:
        type: string
      description: Search term for filtering results

    tenantIdHeader:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
      description: Active tenant. Falls back to the signed JWT claim or the user's first active tenant.

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Unauthorized'

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Forbidden'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: 'Resource not found'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: Health
    description: System health monitoring endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Roles
    description: Role management operations (admin only)
  - name: Files
    description: File upload and management
  - name: Profile
    description: Current user profile operations
  - name: Permissions
    description: Permission management operations (admin only)
  - name: Clients
    description: Tenant-scoped legal client management
  - name: Folders
    description: Tenant-scoped legal matter and folder management
  - name: Processes
    description: Tenant-scoped judicial proceedings and parties
  - name: Tenants
    description: Tenant memberships and active-tenant switching
  - name: Tasks
    description: Tenant-scoped work items with due dates and ownership
  - name: Hearings
    description: Hearings, judgments, and attendee assignments
  - name: Deadlines
    description: Judicial and operational deadlines, separate from hearings
  - name: Movements
    description: Canonical process movements and append-only activity timelines
  - name: Documents
    description: Legal metadata linked to canonical file records
  - name: Favorites
    description: Per-user folder favorites
  - name: Dashboard
    description: Real tenant-scoped aggregate and widget read models
  - name: Notifications
    description: Recipient-owned notifications
  - name: Messages
    description: Internal user-to-user messages
  - name: AI
    description: Persisted, user-owned AI conversations
  - name: Realtime
    description: Authenticated private Transmit channels over Server-Sent Events

paths:
  /version:
    get:
      operationId: getApiInfo
      summary: Get API information
      description: Returns basic information about the API
      tags:
        - Health
      security: []
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: 'benicio'
                  description:
                    type: string
                    example: 'Plataforma jurídica multi-tenant construída com AdonisJS, Inertia e React.'
                  version:
                    type: string
                    example: '0.0.0'
                  author:
                    type: string
                    example: 'Gabriel Maia'
                  contributors:
                    type: array
                    items:
                      type: string
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Check the health status of the API and its services
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                    example: true
                  services:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          healthy:
                            type: boolean
                            example: true
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                    example: false
                  services:
                    type: object

  /api/v1/sessions/sign-in:
    post:
      operationId: signIn
      summary: User login
      description: Authenticate a user and receive JWT tokens
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uid
                - password
              properties:
                uid:
                  type: string
                  description: Email or username
                  example: 'john@example.com'
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: 'password123'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errors:
                  - message: 'Invalid credentials'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/me:
    get:
      operationId: getProfile
      summary: Get current user profile
      description: Retrieve the profile of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/me/permissions:
    get:
      operationId: getMyPermissions
      summary: Get current user permissions
      description: Retrieve the permissions of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Permissions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                      example: 'users.create'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/me/roles:
    get:
      operationId: getMyRoles
      summary: Get current user roles
      description: Retrieve the roles of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/sessions/sign-up:
    post:
      operationId: signUp
      summary: User registration
      description: Create a new user account
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - password_confirmation
              properties:
                full_name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  format: email
                  example: 'john@example.com'
                username:
                  type: string
                  example: 'johndoe'
                  description: Optional username
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: 'password123'
                password_confirmation:
                  type: string
                  format: password
                  example: 'password123'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/verify-email:
    get:
      operationId: verifyEmail
      summary: Verify user email
      description: Verify a user's email address using a token from the verification link.
      tags:
        - Authentication
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: The email verification token
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token

  /api/v1/resend-verification-email:
    post:
      operationId: resendVerificationEmail
      summary: Resend verification email
      description: Resends the email verification link to the authenticated user.
      tags:
        - Authentication
      responses:
        '200':
          description: Verification email sent successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users
      description: Get a paginated list of users with optional search and sorting
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/orderParam'
        - $ref: '#/components/parameters/searchParam'
      responses:
        '200':
          description: User list retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      operationId: createUser
      summary: Create user
      description: Create a new user account (requires USER role)
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - password_confirmation
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                username:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 6
                password_confirmation:
                  type: string
                  format: password
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/{id}:
    get:
      operationId: getUserById
      summary: Get user by ID
      description: Retrieve a specific user's details
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      operationId: updateUser
      summary: Update user
      description: Update user details (email and username cannot be changed)
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 6
                password_confirmation:
                  type: string
                  format: password
                  description: Required if password is provided
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      operationId: deleteUser
      summary: Delete user
      description: Soft delete a user (marks as deleted)
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/roles:
    get:
      operationId: listRoles
      summary: List roles
      description: Get a paginated list of roles (requires ADMIN or ROOT role)
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Role list retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/admin/roles/attach:
    put:
      operationId: attachRoles
      summary: Attach roles to user
      description: Assign roles to a user (requires ADMIN or ROOT role)
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - role_ids
              properties:
                user_id:
                  type: integer
                  example: 1
                role_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: Roles attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Role attached successfully'
        '401':
