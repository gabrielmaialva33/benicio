    post:
      operationId: analyzeAiPrecatorio
      summary: Analyze a tenant-owned precatorio folder
      tags: [AI]
      x-permission: ai.create
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiAnalyzePrecatorioInput' }
      responses:
        '200':
          description: Validated precatorio analysis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiOperationResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { description: AI provider or structured output failed }

  /api/v1/ai/history:
    get:
      operationId: listAiAnalysisHistory
      summary: List the current user's analysis history inside the active tenant
      tags: [AI]
      x-permission: ai.list
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
        - $ref: '#/components/parameters/pageParam'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: type
          in: query
          schema: { type: string, maxLength: 80 }
        - name: status
          in: query
          schema: { type: string, enum: [processing, completed, failed] }
      responses:
        '200':
          description: Paginated analysis history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data: { type: array, items: { type: object, additionalProperties: true } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/ai/usage-stats:
    get:
      operationId: getAiUsageStats
      summary: Get the current user's 30-day tenant-scoped AI usage
      tags: [AI]
      x-permission: ai.read
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
      responses:
        '200':
          description: Usage totals and token counts grouped by analysis type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiOperationResponse' }

  /api/v1/ai/chat:
    post:
      operationId: createAiChatTurn
      summary: Persist a user turn and generate a complete assistant response
      tags: [AI]
      x-permission: ai.create
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiChatInput' }
      responses:
        '200':
          description: Persisted assistant message and conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiChatResponse' }
        '404': { description: Conversation was not found for this tenant and user }
        '409': { description: The conversation is already generating another response }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { description: Configured AI provider failed }
        '503': { description: 'AI provider is disabled, incomplete, or invalid' }

  /api/v1/ai/chat/stream:
    post:
      operationId: streamAiChatTurn
      summary: Persist a user turn and stream the assistant response as SSE
      description: |
        Emits `data: {"content":"..."}` chunks, then a conversation event containing
        `{ "content": "", "conversation": { "id", "title" } }`, followed by
        `data: [DONE]`. If an upstream error occurs after streaming starts, an error event is
        emitted before `[DONE]` and the conversation is marked `error`.
      tags: [AI]
      x-permission: ai.create
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiChatInput' }
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema: { type: string }
        '404': { description: Conversation was not found for this tenant and user }
        '409': { description: The conversation is already generating another response }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          { description: 'AI provider is disabled, incomplete, or invalid before streaming starts' }

  /api/v1/ai/conversations:
    get:
      operationId: listAiConversations
      summary: List the current user's persisted conversations
      tags: [AI]
      x-permission: ai.list
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
      responses:
        '200':
          description: Paginated conversations with each last message
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AiConversation' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/ai/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/pathId'
      - $ref: '#/components/parameters/tenantIdHeader'
    get:
      operationId: getAiConversation
      summary: Get one current-user conversation with ordered messages
      tags: [AI]
      x-permission: ai.read
      responses:
        '200':
          description: Conversation and messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AiConversation' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: deleteAiConversation
      summary: Soft-delete a current-user conversation
      tags: [AI]
      x-permission: ai.delete
      responses:
        '204': { description: Conversation deleted }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { description: Conversation is currently generating }

  /__transmit/events:
    get:
      operationId: openRealtimeEventStream
      summary: Open the authenticated Transmit event stream
      description: |
        Browser EventSource clients authenticate through the HTTP-only access-token cookie set at
        sign-in/refresh. API clients may use Bearer authentication. The active tenant must match
        `x-tenant-id` or the signed JWT tenant claim.
      tags: [Realtime]
      parameters:
        - name: uid
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/tenantIdHeader'
      responses:
        '200':
          description: Transmit SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /__transmit/subscribe:
    post:
      operationId: subscribeRealtimeChannel
      summary: Subscribe a Transmit UID to an authorized private channel
      description: |
        Allowed channels are `tenants/{tenantId}/users/{userId}/notifications`,
        `tenants/{tenantId}/users/{userId}/messages`, and `tenants/{tenantId}/activity`.
        User channels require the authenticated user ID; every channel requires the active tenant.
      tags: [Realtime]
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [uid, channel]
              properties:
                uid: { type: string, minLength: 1 }
                channel: { type: string, minLength: 1 }
      responses:
        '204': { description: Channel subscribed }
        '400': { description: Invalid or unauthorized channel }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /__transmit/unsubscribe:
    post:
      operationId: unsubscribeRealtimeChannel
      summary: Unsubscribe a Transmit UID from an authorized private channel
      tags: [Realtime]
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [uid, channel]
              properties:
                uid: { type: string, minLength: 1 }
                channel: { type: string, minLength: 1 }
      responses:
        '204': { description: Channel unsubscribed }
        '400': { description: Invalid or unauthorized channel }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
