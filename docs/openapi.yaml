  /api/v1/files/upload:
    post:
      operationId: uploadFile
      x-permission: files.create
      summary: Upload file
      description: |
        Upload a file to the server. Files are automatically categorized based on their type.

        **File constraints:**
        - Maximum size: 10MB
        - Allowed extensions: jpeg, jpg, png, pdf, doc, docx, txt, csv, xls, xlsx, mp3, mp4, zip

        **Categories:**
        - `image`: jpeg, jpg, png
        - `document`: pdf, doc, docx, txt
        - `video`: mp4
        - `audio`: mp3
        - `file`: csv, xls, xlsx, zip, and others
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/tenantIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: File validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errors:
                  - message: 'File size should be less than 10MB'
                    field: 'file'
                    rule: 'size'

